<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Alexandra Escalante</title>

<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
    color: white;

    background-image:
      linear-gradient(rgba(163, 121, 42, 0.808), rgba(163, 121, 42, 0.808)),
      url("img/1.jpg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }

  /* nombre principal */
  .titulo {
    position: absolute;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%);

    font-family: "Century Gothic", "Trebuchet MS", Arial, sans-serif;
    font-size: 28px;
    font-weight: 400;
    letter-spacing: 0.4px;
    color: white;
    white-space: nowrap;
  }

  /* menú inferior */
  nav {
    position: absolute;
    bottom: 32px;
    width: 100%;
    text-align: center;
  }

  nav a {
    display: inline-block;
    margin: 0 22px;

    font-family: "Century Gothic", "Trebuchet MS", Arial, sans-serif;
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 0.3px;

    color: white;
    text-decoration: none;
  }

  nav a:hover {
    opacity: 0.75;
  }
</style>
</head>

<body>

<div class="titulo">Alexandra Escalante</div>

<nav>
  <a href="obras.html">Obras</a>
