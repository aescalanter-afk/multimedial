        body {
            font-family: Arial, sans-serif;
            background-color: #f7c7e7;
            margin: 0;
        }

        /* Contenedor principal */
        .contenedor {
            width: 80%;
            margin: auto;
        }

        /* Sección o bloque */
        .bloque {
            background-color: rgb(255, 255, 255);
            margin: 100px 0;
            padding: 100px;
            border-radius: 10px;
            text-align: center;
        }

        .bloque img {
            width: 40%;
            height: auto;
            margin: 50px 0;
        }

        .bloque h2 {
            margin-top: 10px;
        }

        .bloque p {
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <!-- BLOQUE 1 -->

            </p>
